<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Finder</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 class="text-center">Weather Finder</h1>

<p class="text-center">
    Enter a location to view the current weather.
</p>

    <div class="d-flex flex-wrap justify-content-center gap-3 mt-4">

        <div>
            <label for="city" class="form-label">City</label>
            <input type="text"
                class="form-control"
                id="city"
                placeholder="Enter city">
        </div>

        <div>
            <label for="units" class="form-label">Temperature Units</label>
            <select class="form-select" id="units">
                <option value="fahrenheit">Fahrenheit</option>
                <option value="celsius">Celsius</option>
            </select>
        </div>

        <div class="d-flex align-items-end">
            <button class="btn btn-primary" id="weatherButton">
                Get Weather
            </button>
        </div>

    </div>

    <div id="weatherResult" class="mt-4 text-center shadow-sm"></div>

    <script src="script.js"></script>

</body>
</html>
