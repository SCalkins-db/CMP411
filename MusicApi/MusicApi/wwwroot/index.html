<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Music Collection</title>
    <link rel="stylesheet" href="css/site.css" />
</head>

<body>
    <h1>Music Collection</h1>

    <h3>Add Song</h3>
    <form onsubmit="return addItem();">
        <input type="text" id="add-songName" placeholder="Song" required>
        <input type="text" id="add-artistName" placeholder="Artist" required>
        <input type="number" id="add-rating" min="0" max="5"
               placeholder="Rating" required>
        <input type="submit" value="Add">
    </form>

    <div id="editForm">
        <h3>Edit Song</h3>
        <form action="javascript:void(0);" onsubmit="updateItem()">
            <input type="hidden" id="edit-id">

            <input type="text" id="edit-songName"
                   placeholder="Song name" required>

            <input type="text" id="edit-artistName"
                   placeholder="Artist name" required>

            <input type="number" id="edit-rating"
                   min="0" max="5" placeholder="Rating" required>

            <input type="submit" value="Save">
            <a onclick="closeInput()" aria-label="Close">&#10006;</a>
        </form>
    </div>

    <p id="counter"></p>

    <table>
        <tr>
            <th>Song</th>
            <th>Artist</th>
            <th>Rating</th>
            <th></th>
            <th></th>
        </tr>

        <tbody id="musicItems"></tbody>
    </table>

    <script src="js/site.js"></script>

    <script type="text/javascript">
        getItems();
    </script>
</body>
</html>
