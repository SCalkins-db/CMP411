<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Builder</title>
    <link rel="stylesheet" href="exercise.css">
</head>

<body>

<h1>List Builder</h1>

<div class="container">

    <div class="column">
        <h2>Form to obtain a word and place it in a list</h2>

        <form>
            <label for="word">Word to check:</label>
            <input type="text" id="word">

            <br>

            <label for="listNumber">List 1 or 2:</label>
            <input type="number" id="listNumber">

            <br>

            <button type="button" onclick="validateAndAdd()">Add to list</button>
        </form>
    </div>

    <div class="column">
        <h2>List 1</h2>

        <ul id="list1"></ul>

        <button type="button" onclick="clearList1()">Clear the list</button>    </div>

    <div class="column">
        <h2>List 2</h2>

        <ul id="list2"></ul>

        <button type="button" onclick="clearList2()">Clear the list</button>    </div>

</div>

    <script src="exercise.js"></script>
</body>

</html>
