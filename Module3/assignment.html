<body>

<h1>Palindrome Checker</h1>

<div class="container">

    <div class="column">
        <h2>Form to obtain a word and check if it is a palindrome</h2>

        <form>
            <label for="word">Word to check:</label>
            <input type="text" id="word">

            <br>

            <label for="listNumber">Algorithm to use (1 or 2):</label>
            <input type="number" id="listNumber">

            <br>

            <button type="button" onclick="validateAndAdd()">Check and add to list</button>
        </form>
    </div>

    <div class="column">
        <h2>Algorithm 1</h2>
        <p>(word: palindrome?)</p>

        <ul id="list1"></ul>

        <button type="button" onclick="clearList1()">Clear the list</button>    </div>

    <div class="column">
        <h2>Algorithm 2</h2>
        <p>(word: palindrome?)</p>

        <ul id="list2"></ul>

        <button type="button" onclick="clearList2()">Clear the list</button>    </div>

</div>
